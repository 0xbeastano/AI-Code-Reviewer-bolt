# Netlify configuration for AI Code Review Agent

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  framework = "vite"

# Environment variables for the Netlify deployment
[template.environment]
  VITE_SUPABASE_URL = "Your Supabase URL"
  VITE_SUPABASE_ANON_KEY = "Your Supabase Anon Key"
  VITE_GITHUB_CLIENT_ID = "Your GitHub Client ID"
  VITE_APP_URL = "https://ai-code-reviewerz.netlify.app"